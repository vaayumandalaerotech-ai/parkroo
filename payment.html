<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Your Booking</title>
    <script src="https://js.stripe.com/v3/"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8f9fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h1 { color: #333; }
        #payment-element { margin-bottom: 1.5rem; }
        button { background-color: #007bff; color: white; border: none; padding: 12px 15px; border-radius: 4px; width: 100%; font-size: 16px; cursor: pointer; transition: background-color 0.2s; }
        button:hover { background-color: #0056b3; }
        button:disabled { background-color: #cccccc; cursor: not-allowed; }
        #error-message { color: #dc3545; margin-top: 1rem; font-size: 14px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Confirm Payment</h1>
        <p>Booking spot: <strong id="spot-id-display">...</strong> for <strong id="amount-display">$...</strong></p>
        <form id="payment-form">
            <div id="payment-element">
                <!-- Stripe.js will inject the Payment Element here -->
            </div>
            <button id="submit">
                <span id="button-text">Pay now</span>
            </button>
            <div id="error-message">
                <!-- Display error messages here -->
            </div>
        </form>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const spotId = urlParams.get('spot_id');
        const amount = urlParams.get('amount');
        const token = urlParams.get('token');
        const publishableKey = urlParams.get('pk');

        document.getElementById('spot-id-display').textContent = spotId;
        document.getElementById('amount-display').textContent = `$${(amount / 100).toFixed(2)}`;

        if (!publishableKey) {
            document.getElementById('error-message').textContent = "Configuration error: Publishable key is missing.";
        }

        const stripe = Stripe(publishableKey);

        let elements;

        initialize();

        document.getElementById("payment-form").addEventListener("submit", handleSubmit);

        // Fetches a payment intent and captures the client secret
        async function initialize() {
            const response = await fetch("http://localhost:8000/create-payment-intent", {
                method: "POST",
                headers: { 
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${token}`
                },
                body: JSON.stringify({ spot_id: spotId, amount: parseInt(amount) }),
            });
            const { clientSecret } = await response.json();

            elements = stripe.elements({ clientSecret });

            const paymentElement = elements.create("payment");
            paymentElement.mount("#payment-element");
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const { error } = await stripe.confirmPayment({
                elements,
                confirmParams: { return_url: `http://localhost:8501?payment_success=true&spot_id=${spotId}` },
            });
        }
    </script>
</body>
</html>
