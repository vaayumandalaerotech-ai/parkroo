<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Melbourne Live Parking Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css" />
<link rel="stylesheet" href="https://unpkg.com/leaflet-geosearch@3.11.0/dist/geosearch.css" />
<style>
  
  html, body {
    height: 100%;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
    background-color: #0f172a; /* slate-900 */
  }

  #root {
    height: 100%;
  }
  
  .leaflet-container {
    height: 100%;
    width: 100%;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .animate-fade-in {
    animation: fadeIn 0.3s ease-out forwards;
  }

  /* Control Panel Styling */
  #control-panel {
    position: absolute;
    top: 1rem;
    /* --- MODIFIED: Panel moved to the right --- */
    right: 1rem; 
    z-index: 1000;
    width: 20rem;
    background-color: rgba(30, 41, 59, 0.8); /* slate-800 with opacity */
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    color: #cbd5e1; /* slate-300 */
    padding: 1rem;
    border-radius: 0.5rem;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    border: 1px solid #334155; /* slate-700 */
  }

  /* --- ADDED: New panel for the left side --- */
  #street-results-panel {
    position: absolute;
    top: 1rem;
    left: 1rem;
    z-index: 1000;
    width: 18rem;
    max-height: calc(100% - 2rem);
    overflow-y: auto;
    background-color: rgba(30, 41, 59, 0.8);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    color: #cbd5e1;
    padding: 1rem;
    border-radius: 0.5rem;
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
    border: 1px solid #334155;
  }
  
  .panel-section {
    padding-top: 0.75rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid #334155; /* slate-700 */
  }
  .panel-section:last-child {
    border-bottom: none;
    padding-bottom: 0;
  }

  #control-panel h1, #street-results-panel h1 {
    font-size: 1.25rem;
    font-weight: bold;
    color: #ffffff;
  }

  #control-panel h2, #street-results-panel h2 {
    font-weight: 600;
    color: #ffffff;
    margin-bottom: 0.5rem;
  }
  
  #control-panel p, #street-results-panel p {
    font-size: 0.75rem;
    color: #94a3b8; /* slate-400 */
  }

  .flex-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .legend-container {
    display: flex;
    justify-content: space-around;
    font-size: 0.875rem;
  }

  .legend-item {
    display: flex;
    align-items: center;
  }
  .legend-dot {
    width: 0.75rem;
    height: 0.75rem;
    border-radius: 0.125rem;
    margin-right: 0.5rem;
  }
  .dot-green { background-color: #22c55e; } /* green-500 */
  .dot-red { background-color: #ef4444; } /* red-500 */
  .dot-slate { background-color: #64748b; } /* slate-500 */

  .stats-container .text-center { text-align: center; }
  .stats-container .count { display: block; font-weight: bold; font-size: 1.125rem; }
  .stats-container .label { display: block; font-size: 0.75rem; color: #94a3b8; }
  .count.free { color: #4ade80; } /* green-400 */
  .count.occupied { color: #f87171; } /* red-400 */
  
  .status-bar {
      font-size: 0.75rem;
      color: #94a3b8; /* slate-400 */
      margin-top: 0.5rem;
  }

  /* Controls */
  button {
    padding: 0.5rem 0.75rem;
    font-size: 0.875rem;
    background-color: #2563eb; /* blue-600 */
    color: white;
    border: none;
    border-radius: 0.375rem;
    cursor: pointer;
    transition: background-color 0.2s;
    font-weight: 600;
  }
  button:hover {
    background-color: #3b82f6; /* blue-500 */
  }

  .checkbox-label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    cursor: pointer;
    font-size: 0.875rem;
  }
  
  /* Selected Bay Info */
  #selected-info {
      margin-top: 0.75rem;
  }
  #selected-info-content {
      padding: 0.75rem;
      background-color: rgba(51, 65, 85, 0.5); /* slate-700/50 */
      border-radius: 0.5rem;
  }
  #selected-info h3 {
      font-weight: bold;
      font-size: 1.125rem;
      color: #ffffff;
      margin-top: 0;
  }
  #selected-info p {
      font-size: 0.875rem;
      color: #cbd5e1; /* slate-300 */
  }
  #selected-info .label {
      font-weight: 600;
  }

  /* Hide Leaflet Routing Machine's default itinerary panel */
  .leaflet-routing-container {
      display: none;
  }

  /* ADDED: Styling for the search bar */
  .leaflet-bar-part.leaflet-bar-part-single { border-radius: 0.375rem !important; }
  .glass .leaflet-bar-part {
      background-color: rgba(30, 41, 59, 0.8) !important;
      border: 1px solid #334155 !important; color: white !important;
  }
  .geosearch.geosearch-bar form input {
      background-color: transparent !important; color: white !important;
      padding-left: 1.75rem !important;
  }
</style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.1.1/",

</script>
</head>
<body>
<div id="root"></div>

<script type="module">
import React, { useState, useEffect, useCallback, useMemo, useRef } from "react";
import ReactDOM from "react-dom/client";
import { MapContainer, TileLayer, GeoJSON, useMap, Marker, Popup } from "react-leaflet";
import L from "leaflet";
// This import is for side-effects, it attaches L.Routing to the L object
import 'leaflet-routing-machine';

import { GeoSearchControl, OpenStreetMapProvider } from 'leaflet-geosearch';



const PARKING_RECORDS_API_URL = 'https://data.melbourne.vic.gov.au/api/explore/v2.1/catalog/datasets/on-street-parking-bay-sensors/records';
const API_RECORDS_LIMIT = 100;
const MAP_INITIAL_CENTER = [-37.8136, 144.9631];
const MAP_INITIAL_ZOOM = 14;
const MAP_TILE_URL = "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png";
const MAP_ATTRIBUTION = '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>';



const delay = (ms) => new Promise(res => setTimeout(res, ms));

function recordToFeature(record) {
    return {
        type: 'Feature',
        geometry: {
            type: 'Point',
            coordinates: [record.location.lon, record.location.lat],
        },
        properties: {
            kerbsideid: record.kerbsideid,
            status_description: record.status_description,
            zone_info: record.zone_info,
        },
    };
}

async function fetchParkingBays() {
    let allRecords = [];
    
    try {
        const firstUrl = `${PARKING_RECORDS_API_URL}?limit=${API_RECORDS_LIMIT}&offset=0`;
        const firstResponse = await fetch(firstUrl);
        if (!firstResponse.ok) {
            throw new Error(`API error on initial fetch: ${firstResponse.status}`);
        }
        const firstData = await firstResponse.json();
        allRecords.push(...firstData.results);

        const totalCount = firstData.total_count || 0;

        if (totalCount > API_RECORDS_LIMIT) {
            const pageUrls = [];
            for (let offset = API_RECORDS_LIMIT; offset < totalCount; offset += API_RECORDS_LIMIT) {
                pageUrls.push(`${PARKING_RECORDS_API_URL}?limit=${API_RECORDS_LIMIT}&offset=${offset}`);
            }

            const BATCH_SIZE = 3;
            for (let i = 0; i < pageUrls.length; i += BATCH_SIZE) {
                const batchUrls = pageUrls.slice(i, i + BATCH_SIZE);
                const batchPromises = batchUrls.map(url =>
                    fetch(url).then(res => {
                        if (!res.ok) {
                            console.warn(`API error on page fetch (url: ${url}): ${res.status}`);
                            return { total_count: 0, results: [] };
                        }
                        return res.json();
                    })
                );
                
                const batchResults = await Promise.all(batchPromises);
                
                for (const pageData of batchResults) {
                    if (pageData && Array.isArray(pageData.results)) {
                        allRecords.push(...pageData.results);
                    }
                }
                
                await delay(600);
            }
        }
    } catch (error) {
        console.error('Failed to fetch parking data:', error);
        throw new Error('Failed to fetch parking bay GeoJSON');
    }

    const features = allRecords
        .filter(record => record?.location?.lon && record?.location?.lat)
        .map(recordToFeature);

    return {
        type: 'FeatureCollection',
        features,
    };
}



const Routing = ({ start, end }) => {
    const map = useMap();
    useEffect(() => {
        if (!map || !start || !end) return;
        const routingControl = L.Routing.control({
            waypoints: [ L.latLng(start[0], start[1]), L.latLng(end[0], end[1]) ],
            routeWhileDragging: false, addWaypoints: false, draggableWaypoints: false, fitSelectedRoutes: true, show: false,
            lineOptions: { styles: [{ color: '#818cf8', opacity: 0.8, weight: 6 }] },
            createMarker: function() { return null; }
        }).addTo(map);
        return () => { if (map && routingControl) { map.removeControl(routingControl); } };
    }, [map, start, end]);
    return null;
};



const SearchControl = ({ onSearchResult }) => {
    const map = useMap();
    useEffect(() => {
        const provider = new OpenStreetMapProvider();
        const searchControl = new GeoSearchControl({
            provider, style: 'bar', showMarker: false, autoClose: true, searchLabel: 'Enter destination...',
        });
        map.addControl(searchControl);
        const onShowLocation = (result) => onSearchResult(L.latLng(result.location.y, result.location.x), result.location.label);
        map.on('geosearch/showlocation', onShowLocation);
        return () => { map.removeControl(searchControl); map.off('geosearch/showlocation', onShowLocation); };
    }, [map, onSearchResult]);
    return null;
};


const StreetResultsPanel = ({ bays, destinationLabel, onSelectParking }) => {
    if (!destinationLabel) {
        return null;
    }
    return React.createElement('div', { id: 'street-results-panel' },
        React.createElement('h1', null, destinationLabel.split(',')[0]),
        React.createElement('p', null, `Found ${bays.length} available bays within 200m:`),
        React.createElement('div', { className: 'bays-list' },
            bays.length > 0
            ? bays.map(({ bay, distance }) =>
                React.createElement('div', { key: bay.properties.kerbsideid, style: { padding: '0.5rem', borderTop: '1px solid #334155' } },
                    React.createElement('p', { style: { fontWeight: 'bold', margin: 0, color: '#ffffff', fontSize: '0.8rem' } }, `Bay ID: ${bay.properties.kerbsideid}`),
                    React.createElement('div', { style: { display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginTop: '0.25rem' } },
                        React.createElement('span', { style: { fontSize: '0.75rem' } }, `${Math.round(distance)} meters away`),
                        React.createElement('button', { onClick: () => onSelectParking(bay), style: { padding: '0.25rem 0.5rem', fontSize: '0.75rem' } }, 'Route Here')
                    )
                )
            )
            : React.createElement('p', {style: {fontSize: '0.75rem'}}, 'No available bays found nearby.')
        )
    );
};



const SelectedBayInfo = ({ bay, onSetStartFromBay }) => (
    React.createElement('div', { id: 'selected-info-content', className: 'animate-fade-in' },
        React.createElement('h3', null, 'Selected Bay'),
        React.createElement('p', null, React.createElement('span', { className: 'label' }, 'Bay ID:'), ` ${bay.properties?.kerbsideid ?? 'N/A'}`),
        React.createElement('p', null, React.createElement('span', { className: 'label' }, 'Restriction:'), ` ${bay.properties?.zone_info || 'N/A'}`),
        React.createElement('button', { 
            onClick: () => onSetStartFromBay(bay), 
            style: { width: '100%', marginTop: '0.5rem' }
        }, 'Set as starting point')
    )
);

const ControlPanel = ({
    counts, statusMessage, selectedBay, onRefresh, showBays, onToggleBays,
    lastUpdated, onSetStartMode, onFindNearest, onClearRoute, startPoint, onSetStartFromBay
}) => {
    return React.createElement('div', { id: 'control-panel' },
        React.createElement('div', { style: { paddingBottom: '0.75rem', borderBottom: '1px solid #334155' } },
            React.createElement('h1', null, 'Melbourne Parking'),
            React.createElement('p', null, 'Live On-Street Sensor Data')
        ),
        React.createElement('div', { className: 'panel-section stats-container' },
            React.createElement('h2', null, 'Status'),
            React.createElement('div', { className: 'flex-container' },
                React.createElement('div', { className: 'text-center' }, React.createElement('span', { className: 'count free' }, counts.free > 0 ? counts.free : '...'), React.createElement('span', { className: 'label' }, 'Available')),
                React.createElement('div', { className: 'text-center' }, React.createElement('span', { className: 'count occupied' }, counts.occupied > 0 ? counts.occupied : '...'), React.createElement('span', { className: 'label' }, 'Occupied'))
            ),
            React.createElement('div', { className: 'status-bar flex-container' }, React.createElement('span', null, statusMessage), lastUpdated && React.createElement('span', null, lastUpdated.toLocaleTimeString()))
        ),
        React.createElement('div', { className: 'panel-section' },
            React.createElement('h2', null, 'Find Parking'),
            React.createElement('div', { className: 'flex-container', style: { gap: '0.5rem', flexDirection: 'column', alignItems: 'stretch' } },
                !startPoint ? (React.createElement('button', { onClick: onSetStartMode }, 'Set Starting Point on Map'))
                : (React.createElement(React.Fragment, null, React.createElement('button', { onClick: onFindNearest }, 'Find Nearest Available Bay'), React.createElement('p', { style: { fontSize: '0.75rem', textAlign: 'center', color: '#94a3b8', margin: '0.5rem 0 0' } }, `Start: ${startPoint.lat.toFixed(4)}, ${startPoint.lng.toFixed(4)}`))),
                startPoint && React.createElement('button', { onClick: onClearRoute, style: { backgroundColor: '#475569', marginTop: '0.5rem' } }, 'Clear Route & Start Point')
            )
        ),
        React.createElement('div', { className: 'panel-section' },
            React.createElement('h2', null, 'Legend'),
            React.createElement('div', { className: 'legend-container' },
                React.createElement('div', { className: 'legend-item' }, React.createElement('span', { className: 'legend-dot dot-green' }), 'Free'),
                React.createElement('div', { className: 'legend-item' }, React.createElement('span', { className: 'legend-dot dot-red' }), 'Occupied'),
                React.createElement('div', { className: 'legend-item' }, React.createElement('span', { className: 'legend-dot dot-slate' }), 'Unknown')
            )
        ),
        React.createElement('div', { className: 'panel-section' },
            React.createElement('h2', null, 'Map Controls'),
            React.createElement('div', { className: 'flex-container' },
                React.createElement('button', { onClick: onRefresh, style: { padding: '0.375rem 0.75rem' } }, 'Refresh Now'),
                React.createElement('label', { className: 'checkbox-label' }, React.createElement('input', { type: 'checkbox', checked: showBays, onChange: onToggleBays }), React.createElement('span', null, 'Show Bays'))
            )
        ),
        React.createElement('div', { id: 'selected-info' },
            selectedBay && React.createElement(SelectedBayInfo, { bay: selectedBay, onSetStartFromBay: onSetStartFromBay })
        )
    );
};



const BayStyle = (feature) => {
    const status = feature?.properties?.status_description;
    let color = '#64748b';
    if (status === 'Unoccupied') color = '#22c55e';
    if (status === 'Present') color = '#ef4444';
    return { radius: 5, fillColor: color, color: "#1e293b", weight: 1, opacity: 1, fillOpacity: 0.8 };
};
const onEachBay = (feature, layer, onBaySelect) => {
    layer.on({ click: (e) => { L.DomEvent.stopPropagation(e); onBaySelect(feature); } });
};
const BayLayer = ({ data, onBaySelect, lastUpdated }) => {
    const map = useMap();
    const hasFitBounds = useRef(false);
    useEffect(() => {
        if (data && !hasFitBounds.current) {
            const bounds = L.geoJSON(data).getBounds();
            if (bounds.isValid()) {
                map.fitBounds(bounds, { padding: [50, 50] });
                hasFitBounds.current = true;
            }
        }
    }, [data, map]);
    return React.createElement(GeoJSON, {
        key: lastUpdated?.getTime(), data: data,
        pointToLayer: (feature, latlng) => L.circleMarker(latlng, BayStyle(feature)),
        onEachFeature: (feature, layer) => onEachBay(feature, layer, onBaySelect)
    });
};
const MapEvents = ({ onMapClick, isSettingStart, onSetStart }) => {
    useMap().on('click', (e) => {
        if (isSettingStart) { onSetStart(e.latlng); } else { onMapClick(); }
    });
    return null;
};
const startIcon = new L.Icon({
    iconUrl: 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0Ij48cGF0aCBmaWxsPSIjNGFkZTgwIiBkPSJNMTIgMkM2LjQ4IDIgMiA2LjQ4IDIgMTJzNC40OCAxMCAxMCAxMCAxMC00LjQ4IDEwLTEwUzE3LjUyIDIgMTIgMnoiLz48cGF0aCBmaWxsPSIjZmZmZmZmIiBkPSJNMTIgNiBjLTEuNjYgMC0zIDEuMzQtMyAzcyAxLjM0IDMgMyAzIDMtMS4zNCAzLTMtMS4zNC0zLTMtM3oiLz48L3N2Zz4=',
    iconSize: [32, 32], iconAnchor: [16, 16], popupAnchor: [0, -16],
});


const destinationIcon = new L.Icon({
    iconUrl: 'data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIyNCIgaGVpZ2h0PSIyNCIgdmlld0JveD0iMCAwIDI0IDI0Ij48cGF0aCBmaWxsPSIjZjU5ZTAwIiBkPSJNMTIgMkM4LjEzIDIgNSAzLjU4IDUgNy4yNWMwIDEuODggMS4xOSA0LjQ1IDMuMjEgNi43MkMxMC40IDExLjcxIDEyIDEzLjY0IDEyIDEzLjY0czEuNi0xLjkzIDMuNzktNi42N0M3LjgxIDExLjY5IDkgOS4xMyA5IDcuMjUgOSA0LjU4IDEwLjU4IDMgMTIgMnoiLz48Y2lyY2xlIGN4PSIxMiIgY3k9IjcuMjUiIHI9IjIuMjUiIGZpbGw9IiNmZmYiLz48L3N2Zz4=',
    iconSize: [32, 40],
    iconAnchor: [16, 40],
    popupAnchor: [0, -40],
});


const MapComponent = ({ 
    bays, onBaySelect, onMapClick, showBays, lastUpdated,
    isSettingStart, onSetStart, startPoint, children,

    onSetDestination, searchedDestination
}) => {
    return React.createElement(MapContainer, {
            center: MAP_INITIAL_CENTER, zoom: MAP_INITIAL_ZOOM, scrollWheelZoom: true, 
            style: { cursor: isSettingStart ? 'crosshair' : 'grab' }
        },
        React.createElement(TileLayer, { url: MAP_TILE_URL, attribution: MAP_ATTRIBUTION }),
        bays && showBays && React.createElement(BayLayer, { data: bays, onBaySelect: onBaySelect, lastUpdated: lastUpdated }),
        React.createElement(MapEvents, { onMapClick: onMapClick, isSettingStart: isSettingStart, onSetStart: onSetStart }),
        startPoint && React.createElement(Marker, { position: startPoint, icon: startIcon }, React.createElement(Popup, null, 'Starting Point')),
        // --- ADDED: Marker for the searched destination ---
        searchedDestination && React.createElement(Marker, { position: searchedDestination, icon: destinationIcon }, React.createElement(Popup, null, 'Your Destination')),
        // --- ADDED: The SearchControl component itself ---
        React.createElement(SearchControl, { onSearchResult: onSetDestination }),
        children
    );
};



const App = () => {

    const [bays, setBays] = useState(null);
    const [statusMessage, setStatusMessage] = useState('Initializing...');
    const [selectedBay, setSelectedBay] = useState(null);
    const [showBays, setShowBays] = useState(true);
    const [lastUpdated, setLastUpdated] = useState(null);
    const [startPoint, setStartPoint] = useState(null);
    const [destinationPoint, setDestinationPoint] = useState(null);
    const [isSettingStart, setIsSettingStart] = useState(false);
    const isUpdating = useRef(false);

    const [searchedDestination, setSearchedDestination] = useState(null);
    const [destinationLabel, setDestinationLabel] = useState('');
    const [streetBays, setStreetBays] = useState([]);


    const updateData = useCallback(async () => {
        if (isUpdating.current) return;
        isUpdating.current = true;
        setStatusMessage('Updating parking data...');
        setSelectedBay(null);
        try {
            const baysData = await fetchParkingBays();
            setBays(baysData);
            setStatusMessage('Parking data updated.');
            setLastUpdated(new Date());
        } catch (error) {
            console.error(error);
            setStatusMessage('Error updating parking data.');
        } finally {
            isUpdating.current = false;
        }
    }, []);
    

    useEffect(() => {
        updateData();
        const intervalId = setInterval(updateData, 30000);
        return () => clearInterval(intervalId);
    }, [updateData]);

   
    const counts = useMemo(() => {
        let free = 0, occupied = 0;
        if (!bays) return { free, occupied };
        bays.features.forEach(bay => {
            const status = bay.properties?.status_description;
            if (status === 'Unoccupied') free++;
            if (status === 'Present') occupied++;
        });
        return { free, occupied };
    }, [bays]);

    
    useEffect(() => {
        if (!searchedDestination || !bays) {
            setStreetBays([]);
            return;
        }
        const availableBays = bays.features.filter(bay => bay.properties?.status_description === 'Unoccupied');
        const baysWithDistance = availableBays
            .map(bay => {
                const bayLatLng = L.latLng(bay.geometry.coordinates[1], bay.geometry.coordinates[0]);
                const distance = searchedDestination.distanceTo(bayLatLng);
                return { bay, distance };
            })
            .filter(item => item.distance <= 200); // Filter for bays within 200 meters

        baysWithDistance.sort((a, b) => a.distance - b.distance);
        setStreetBays(baysWithDistance);
    }, [searchedDestination, bays]);

    
    const handleSetStart = (latlng) => {
        setStartPoint(latlng);
        setIsSettingStart(false);
        setDestinationPoint(null);
        setStatusMessage('Start point set. Find nearest parking.');
    };
    const handleSetStartFromBay = (bay) => {
        const bayCoords = bay.geometry.coordinates;
        const latlng = L.latLng(bayCoords[1], bayCoords[0]);
        setStartPoint(latlng);
        setIsSettingStart(false);
        setDestinationPoint(null);
        setStatusMessage(`Start point set from Bay ID ${bay.properties.kerbsideid}.`);
    };
    const handleFindNearest = () => {
        if (!startPoint || !bays) { setStatusMessage('Please set a starting point first.'); return; }
        const availableBays = bays.features.filter(bay => bay.properties?.status_description === 'Unoccupied' && bay.geometry.type === 'Point');
        if (availableBays.length === 0) { setStatusMessage('No available parking bays found.'); return; }
        let closestBay = null;
        let minDistance = Infinity;
        availableBays.forEach(bay => {
            const bayLatLng = L.latLng(bay.geometry.coordinates[1], bay.geometry.coordinates[0]);
            const distance = startPoint.distanceTo(bayLatLng);
            if (distance < minDistance) { minDistance = distance; closestBay = bay; }
        });
        if (closestBay) {
            const destCoords = closestBay.geometry.coordinates;
            setDestinationPoint(L.latLng(destCoords[1], destCoords[0]));
            setSelectedBay(closestBay);
            setStatusMessage(`Route found to Bay ID ${closestBay.properties.kerbsideid}.`);
        } else { setStatusMessage('Could not find a suitable parking bay.'); }
    };
    const handleClearRoute = () => {
        setStartPoint(null);
        setDestinationPoint(null);
        setIsSettingStart(false);
        setSelectedBay(null);
        // --- ADDED: Also clear the new state ---
        setSearchedDestination(null);
        setDestinationLabel('');
        setStreetBays([]);
        setStatusMessage('Route cleared.');
    };
    const handleMapClick = () => {
        if (isSettingStart) return;
        setSelectedBay(null);
    };

    
    const handleSetDestination = (latlng, label) => {
        setSearchedDestination(latlng);
        setDestinationLabel(label);
        setStatusMessage("Destination set. See left panel for nearby bays.");
    };
    const handleSelectParkingForRouting = (bay) => {
        if (!startPoint) {
            setStatusMessage("Please set a starting point before routing.");
            return;
        }
        const destCoords = bay.geometry.coordinates;
        setDestinationPoint(L.latLng(destCoords[1], destCoords[0]));
        setSelectedBay(bay);
        setStatusMessage(`Route to Bay ID ${bay.properties.kerbsideid} is ready.`);
    };

    return React.createElement(React.Fragment, null,
        // --- ADDED: The new left panel ---
        React.createElement(StreetResultsPanel, {
            bays: streetBays,
            destinationLabel: destinationLabel,
            onSelectParking: handleSelectParkingForRouting
        }),
        React.createElement(MapComponent, {
            bays: bays, onBaySelect: setSelectedBay, onMapClick: handleMapClick,
            showBays: showBays, lastUpdated: lastUpdated, isSettingStart: isSettingStart,
            onSetStart: handleSetStart, startPoint: startPoint,
            // --- ADDED NEW PROPS ---
            onSetDestination: handleSetDestination,
            searchedDestination: searchedDestination
        },
          startPoint && destinationPoint && React.createElement(Routing, { 
              start: [startPoint.lat, startPoint.lng], 
              end: [destinationPoint.lat, destinationPoint.lng] 
          })
        ),
        React.createElement(ControlPanel, {
            counts: counts, statusMessage: statusMessage, selectedBay: selectedBay,
            onRefresh: updateData, showBays: showBays, onToggleBays: () => setShowBays(prev => !prev),
            lastUpdated: lastUpdated, onSetStartMode: () => { setIsSettingStart(true); setStatusMessage('Click on the map to set a starting point.'); },
            onFindNearest: handleFindNearest, onClearRoute: handleClearRoute, startPoint: startPoint,
            onSetStartFromBay: handleSetStartFromBay
        })
    );
};



const rootElement = document.getElementById('root');
if (!rootElement) { throw new Error("Could not find root element to mount to"); }
const root = ReactDOM.createRoot(rootElement);
root.render( React.createElement(React.StrictMode, null, React.createElement(App, null)) );
</script>
</body>
</html>
